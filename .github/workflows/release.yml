name: Release

# Triggered on semver tag push (e.g. v0.1.0).
# Publishes both ai-catapult (unscoped) and @r3dlex/ai-catapult (scoped)
# via publish-both.ts — the single source of truth for both names.
#
# Auth: npm TRUSTED PUBLISHING (OIDC) — no NPM_TOKEN secret needed.
# Prerequisite (one-time, npmjs.com web UI, per package — both ai-catapult and
# @r3dlex/ai-catapult): package Settings → Trusted Publisher → GitHub Actions
# with organization/user `r3dlex`, repository `ai-catapult`, workflow filename
# `release.yml`, environment empty. Both packages were first-published manually
# on 2026-07-02 (npm requires the package to exist before this can be set).
# Trusted publishing requires Node >= 22.14 and npm CLI >= 11.5.1.
# setup-node resolves the current Node 22 release; npm is upgraded below.
#
# Manual recovery is supported only on new release tags containing this workflow
# and its exact-tag guard; old release tags are not checked out as a workaround.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      package:
        description: 'Exact package to publish after verifying prior partial release'
        required: true
        default: both
        type: choice
        options:
          - both
          - ai-catapult
          - '@r3dlex/ai-catapult'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for --provenance

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          # NOTE: no registry-url here. setup-node's registry-url writes an
          # .npmrc _authToken=${NODE_AUTH_TOKEN} line with a placeholder value,
          # which can shadow the OIDC trusted-publishing exchange. Trusted
          # publishing needs no registry auth config at all.

      - name: Install locked dependencies (TypeScript toolchain)
        run: npm ci --ignore-scripts

      - name: Validate exact release tag and package selection
        id: release-context
        run: node scripts/release-context.ts
        env:
          RELEASE_PACKAGE: ${{ inputs.package }}

      - name: Upgrade npm for trusted publishing (requires >= 11.5.1)
        run: |
          npm install -g npm@11.5.1
          npm --version

      - name: Vendor skills
        run: node scripts/setup.ts

      - name: Verify vendor integrity
        run: node scripts/verify-vendor.ts

      - name: Build both plugins
        run: |
          npm run build:plugin:claude
          npm run build:plugin:codex

      - name: Run tests
        run: npm test

      - name: Install smoke — real install against temp harness dirs
        run: |
          FAKE_HOME=$(mktemp -d)
          FAKE_CODEX=$(mktemp -d)
          mkdir -p "${FAKE_HOME}/.claude"
          export HOME="${FAKE_HOME}"
          export CODEX_HOME="${FAKE_CODEX}"
          node bin/ai-catapult.ts install --harness all

      - name: Publish selected names via OIDC trusted publishing (provenance automatic)
        run: |
          if [[ "$RELEASE_PACKAGE" == both ]]; then
            AI_CATAPULT_PUBLISH=1 node scripts/publish-both.ts --yes
          else
            AI_CATAPULT_PUBLISH=1 node scripts/publish-both.ts --yes --package "$RELEASE_PACKAGE"
          fi
        env:
          RELEASE_PACKAGE: ${{ steps.release-context.outputs.package }}
          CI: 'true'
